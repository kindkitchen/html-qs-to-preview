<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>html preview</title>
<script>
  // ?html=... : the page itself becomes that document (the url is sent to the server).
  // #html=... : the document is shown in a full-page frame. The fragment never leaves the
  //             browser, so there is no size limit, and the document can use its own
  //             #hash and history without wiping itself out of the address bar.
  // Wrapped in a block so no globals leak into the rendered document.
  {
    const param = (s) => new URLSearchParams(s).get("html");
    const query = param(location.search);
    const hash = query ? null : param(location.hash.slice(1));
    // pasting a #html= url while this page is open changes only the hash - reload to render it
    addEventListener("hashchange", () => location.reload());
    if (query || hash) {
      // hide the form so it never flashes
      document.documentElement.style.display = "none";
      // wait until our own parsing has finished
      addEventListener("DOMContentLoaded", () => {
        if (query) {
          document.open(); // wipes this page, listeners included
          document.write(query);
          document.close();
          return;
        }
        const frame = document.createElement("iframe");
        frame.src = URL.createObjectURL(new Blob([hash], { type: "text/html;charset=utf-8" }));
        frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0";
        frame.onload = () => (document.title = frame.contentDocument.title || document.title);
        document.body.replaceChildren(frame);
        document.documentElement.style.display = "";
      });
    }
  }
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; }
  fieldset { width: min(90vw, 40rem); }
  textarea { width: 100%; height: 40vh; box-sizing: border-box; font-family: monospace; }
</style>
</head>
<body>
<fieldset>
  <legend>html &rarr; url</legend>
  <textarea id="src" placeholder="paste html document here" autofocus></textarea>
  <p>
    <button id="copy-encoded">copy encoded</button>
    <button id="copy-url" title="?html=... the page becomes the document; the url is sent to the server, so keep it small">copy url</button>
    <button id="copy-hash-url" title="#html=... the document is shown in a full-page frame; never sent to the server, any size">copy # url</button>
    <output id="status"></output>
  </p>
</fieldset>
<script>
  {
    const src = document.getElementById("src");
    const status = document.getElementById("status");
    const encoded = () => encodeURIComponent(src.value);
    const url = (sep) => location.origin + location.pathname + sep + "html=" + encoded();

    const copy = async (text) => {
      if (!src.value) return (status.textContent = "nothing to copy");
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        // clipboard api is unavailable (e.g. plain http) - fall back to the old way
        const t = document.createElement("textarea");
        t.value = text;
        document.body.append(t);
        t.select();
        document.execCommand("copy");
        t.remove();
      }
      status.textContent = "copied, " + text.length + " chars";
    };

    document.getElementById("copy-encoded").onclick = () => copy(encoded());
    document.getElementById("copy-url").onclick = () => copy(url("?"));
    document.getElementById("copy-hash-url").onclick = () => copy(url("#"));
  }
</script>
</body>
</html>
